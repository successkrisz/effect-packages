name: Release

on:
  push:
    branches:
      - master
      - beta

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-release
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Enable Corepack
        run: |
          corepack enable
          corepack install
          pnpm -v

      - name: Get pnpm store directory
        run: echo "PNPM_STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Each package must trust successkrisz/effect-packages + release.yml on npm.
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2.1.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: pnpm release:publish
          version-script: pnpm release:version
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
