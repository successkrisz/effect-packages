packages:
  - packages/*
  - fixtures/*
  - scratchpad

catalog:
  '@effect/platform-node': 4.1.6
  '@effect/platform-node-shared': 4.1.6
  '@effect/vitest': 4.1.6
  '@types/aws-lambda': ^8.10.152
  '@types/node': ^24.0.4
  effect: 4.1.6

minimumReleaseAgeExclude:
  - effect
  - '@effect/*'
  - '@effect-aws/*'
  - '@changesets/write@1.0.1'
  - '@vitest/expect@4.1.11'
  - '@vitest/mocker@4.1.11'
  - '@vitest/pretty-format@4.1.11'
  - '@vitest/runner@4.1.11'
  - '@vitest/snapshot@4.1.11'
  - '@vitest/spy@4.1.11'
  - '@vitest/utils@4.1.11'
  - vitest@4.1.11

allowBuilds:
  esbuild: true
  lefthook: true
  msgpackr-extract: false
